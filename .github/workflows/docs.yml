name: Docs

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  apidocs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen
        run: |
          curl -fsSL https://github.com/doxygen/doxygen/releases/download/Release_1_17_0/doxygen-1.17.0.linux.bin.tar.gz | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/doxygen-1.17.0/bin" >> "$GITHUB_PATH"

      - name: Build API docs
        run: doxygen docs/Doxyfile

      - uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: html

  pages:
    runs-on: ubuntu-latest
    needs: [apidocs]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: >
      success()
      && github.ref == 'refs/heads/main'
      && github.repository == 'CLIUtils/CLI11'
    steps:
      - uses: actions/configure-pages@v5
        id: pages

      - uses: actions/download-artifact@v4
        with:
          name: api-docs
          path: _site

      - uses: actions/upload-pages-artifact@v3

      - uses: actions/deploy-pages@v4
        id: deployment
