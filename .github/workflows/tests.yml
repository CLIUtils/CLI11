name: Tests
on:
  push:
    branches:
      - main
      - v*
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CTEST_OUTPUT_ON_FAILURE: "1"

jobs:
  preset:
    name: Preset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run CMake Workflow
        run: cmake --workflow default


  catch2-3:
    name: Catch 2 3.x
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get Catch 2
        run: brew install catch2

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_CXX_STANDARD=14 \
            -DCLI11_SINGLE_FILE_TESTS=OFF \
            -DCLI11_BUILD_EXAMPLES=OFF \
            -DCLI11_PRECOMPILED=ON

      - name: Build
        run: cmake --build build -j4

      - name: Test
        run: cmake --build build --target test


  docker:
    name: Docker ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc15 std23
            container: gcc:15
            std: 23
            precompile: OFF
            options: -DCMAKE_CXX_FLAGS="-Wstrict-overflow=5" -DCLI11_ENABLE_EXTRA_VALIDATORS=1
          - name: gcc12 std20
            container: gcc:12
            std: 20
            precompile: OFF
            options: -DCMAKE_CXX_FLAGS="-Wredundant-decls -Wconversion"
              -DCLI11_ENABLE_EXTRA_VALIDATORS=1
          - name: clang17 std23 precompiled
            container: silkeh/clang:17
            std: 23
            precompile: ON
            options: -DCMAKE_CXX_FLAGS="-std=c++23 -stdlib=libc++"
              -DCLI11_ENABLE_EXTRA_VALIDATORS=1 -DCMAKE_CXX_COMPILER=clang++
              -DCLI11_FORCE_LIBCXX=ON -DCMAKE_LINKER_TYPE=LLD
          - name: clang20 std26
            container: silkeh/clang:20
            std: 26
            precompile: OFF
            options: -DCMAKE_CXX_FLAGS="-std=c++2c -stdlib=libc++ -Wdocumentation"
              -DCLI11_ENABLE_EXTRA_VALIDATORS=1 -DCMAKE_CXX_COMPILER=clang++
              -DCLI11_FORCE_LIBCXX=ON -DCMAKE_LINKER_TYPE=LLD
    steps:
      - uses: actions/checkout@v4

      # silkeh/clang does not include ca-certificates, so check the shasum for verification
      - name: Install CMake
        run: |
          wget --no-check-certificate "https://cmake.org/files/v3.31/cmake-3.31.1-linux-x86_64.tar.gz"
          echo "3b72fde0d40fa8be617667ea08d12c5ee47f6cf8950c2fbfcf2acfb5f83fb9de  cmake-3.31.1-linux-x86_64.tar.gz" | sha256sum -c
          tar -xzf cmake-3.31.1-linux-x86_64.tar.gz
          echo "$PWD/cmake-3.31.1-linux-x86_64/bin" >> $GITHUB_PATH

      - name: Configure
        run: cmake -S . -B build -DCLI11_WARNINGS_AS_ERRORS=ON
          -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_STANDARD=${{ matrix.std }}
          -DCLI11_PRECOMPILED=${{ matrix.precompile }} ${{ matrix.options }}

      - name: Build
        run: cmake --build build -j4

      - name: Test
        run: ctest --output-on-failure
        working-directory: build

  clang-tidy:
    name: Clang-Tidy
    runs-on: ubuntu-latest
    container: silkeh/clang:20
    steps:
      - uses: actions/checkout@v4

      - name: Install requirements
        run: apt-get update && apt-get install -y ninja-build

      - name: Configure
        run: cmake --preset tidy

      - name: Build
        run: cmake --build --preset tidy
